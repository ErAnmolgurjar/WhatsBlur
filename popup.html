<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web Styler</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --teal: #00c6a2;
        --teal-glow: rgba(0, 198, 162, 0.25);
        --bg: #0d0f14;
        --surface: #141720;
        --surface2: #1c1f2c;
        --border: rgba(255, 255, 255, 0.07);
        --text: #e8eaf0;
        --muted: #6b7291;
      }

      body {
        width: 300px;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        overflow: hidden;
        padding: 0;
      }

      /* ── Header ── */
      .header {
        padding: 20px 20px 14px;
        background: linear-gradient(135deg, #141720 0%, #0f1219 100%);
        border-bottom: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -30px;
        right: -30px;
        width: 120px;
        height: 120px;
        background: radial-gradient(
          circle,
          rgba(0, 198, 162, 0.15) 0%,
          transparent 70%
        );
        border-radius: 50%;
      }

      .header-top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }

      .logo {
        width: 34px;
        height: 34px;
        background: linear-gradient(135deg, var(--teal), #00a38a);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px var(--teal-glow);
        flex-shrink: 0;
      }

      .logo svg {
        width: 20px;
        height: 20px;
        fill: #000;
      }

      .title {
        font-family: "Syne", sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .subtitle {
        font-size: 11px;
        color: var(--muted);
        font-weight: 300;
        letter-spacing: 0.02em;
      }

      /* ── Main Card ── */
      .card {
        margin: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }

      .card.theme-on {
        border-color: rgba(0, 198, 162, 0.25);
        box-shadow: 0 0 20px rgba(0, 198, 162, 0.06);
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .card-label {
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      /* Status pill */
      .status-pill {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--surface2);
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid var(--border);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }

      .status-dot.active {
        background: var(--teal);
        box-shadow: 0 0 6px var(--teal);
      }

      #status-text {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--muted);
        transition: color 0.3s;
        letter-spacing: 0.03em;
      }

      .status-dot.active + #status-text {
        color: var(--teal);
      }

      /* ── Toggle Switch ── */
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .toggle-label {
        font-size: 12.5px;
        color: var(--muted);
        flex: 1;
        line-height: 1.4;
      }

      .mode-section {
        margin-top: 14px;
      }

      .mode-options {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }

      .mode-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.15s;
      }

      .mode-option:hover {
        border-color: rgba(0, 198, 162, 0.25);
        transform: translateY(-1px);
      }

      .mode-option input {
        accent-color: var(--teal);
      }

      .mode-option span {
        font-size: 12.5px;
        color: var(--text);
        font-weight: 500;
      }

      .mode-option small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.35;
      }

      .switch {
        position: relative;
        width: 48px;
        height: 26px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 26px;
        cursor: pointer;
        transition:
          background 0.3s,
          border-color 0.3s,
          box-shadow 0.3s;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        background: var(--muted);
        border-radius: 50%;
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.3s;
      }

      input:checked + .slider {
        background: rgba(0, 198, 162, 0.15);
        border-color: var(--teal);
        box-shadow: 0 0 12px rgba(0, 198, 162, 0.2);
      }

      input:checked + .slider::before {
        transform: translateX(22px);
        background: var(--teal);
        box-shadow: 0 2px 8px rgba(0, 198, 162, 0.4);
      }

      /* ── Divider ── */
      .divider {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
      }

      /* ── Theme preview strips ── */
      .preview-label {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .preview {
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .preview-bar {
        height: 8px;
        background: #141720;
        border-bottom: 1px solid var(--border);
      }

      .preview-body {
        background: #0d0f14;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .bubble {
        height: 8px;
        border-radius: 6px;
      }

      .bubble.in {
        width: 65%;
        background: #1c1f28;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .bubble.out {
        width: 50%;
        align-self: flex-end;
        background: #1a3a32;
        border: 1px solid rgba(0, 198, 162, 0.12);
      }

      /* ── Open WA Button ── */
      .open-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: calc(100% - 32px);
        margin: 0 16px 16px;
        padding: 11px;
        background: linear-gradient(
          135deg,
          rgba(0, 198, 162, 0.12),
          rgba(0, 198, 162, 0.06)
        );
        border: 1px solid rgba(0, 198, 162, 0.2);
        border-radius: 12px;
        color: var(--teal);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.15s;
        letter-spacing: 0.01em;
      }

      .open-btn:hover {
        background: linear-gradient(
          135deg,
          rgba(0, 198, 162, 0.2),
          rgba(0, 198, 162, 0.1)
        );
        border-color: rgba(0, 198, 162, 0.4);
        transform: translateY(-1px);
      }

      .open-btn:active {
        transform: translateY(0);
      }

      .open-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      /* ── Footer ── */
      .footer {
        padding: 8px 16px 14px;
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        letter-spacing: 0.03em;
        border-top: 1px solid var(--border);
      }

      .footer span {
        color: var(--teal);
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"
            />
          </svg>
        </div>
        <div>
          <div class="title">WhatsBlur</div>
        </div>
      </div>
    </div>

    <!-- Card -->
    <div class="card" id="card">
      <div class="card-top">
        <div class="card-label">Blur Messages</div>
        <div class="status-pill">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Loading…</span>
        </div>
      </div>

      <div class="toggle-row">
        <div class="toggle-label">Apply Blur to WhatsApp Web</div>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="mode-section">
        <div class="preview-label">Blur mode</div>
        <div class="mode-options">
          <label class="mode-option" for="mode-all">
            <input type="radio" name="blur-mode" id="mode-all" value="all" />
            <div>
              <span>Blur everything</span>
              <small>Blurs the contact name and message preview.</small>
            </div>
          </label>

          <label class="mode-option" for="mode-message">
            <input
              type="radio"
              name="blur-mode"
              id="mode-message"
              value="message"
            />
            <div>
              <span>Blur message only</span>
              <small
                >Keeps the contact name visible and blurs only the message
                preview.</small
              >
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- Open WhatsApp Web -->
    <button class="open-btn" id="open-wa">
      <svg viewBox="0 0 24 24">
        <path
          d="M14 3v2H7v14h10v-3h2v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h8Zm5.707 6.293-1.414 1.414L19.586 12H11v2h8.586l-1.293 1.293 1.414 1.414L22.414 13l.293-.293-.293-.293-2.707-2.707Z"
        />
      </svg>
      Open WhatsApp Web
    </button>

    <div class="footer">Styles apply to <span>web.whatsapp.com</span> only</div>

    <script src="popup.js"></script>
  </body>
</html>
